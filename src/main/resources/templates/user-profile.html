<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Your Profile</title>
</head>
<body>

<h1>Welcome, [[${user.name}]]!</h1>

<form action="/user-profile/update" method="post" th:object="${user}">
    <label>Name:</label>
    <input type="text" th:field="*{name}"><br>

    <label>New Password (optional):</label>
    <input type="password" th:field="*{password}"><br>

    <button type="submit">Save changes</button>
</form>

<h2>Your pets</h2>

<ul>
    <li th:each="pet : ${pets}">
        <span th:text="${pet.name}"></span>
        (<span th:text="${pet.type}"></span>)
        <form th:action="@{/user-profile/pets/delete/{id}(id=${pet.id})}" method="post">
            <button type="submit">Delete</button>
        </form>
    </li>
</ul>

<h3>Add pet</h3>
<form th:action="@{/user-profile/pets}" method="post" th:object="${pet}">
    <input th:field="*{name}" placeholder="Name"/>
    <input th:field="*{type}" placeholder="Type"/>
    <button type="submit">Add</button>
</form>

<!-- Admin-only button -->
<div sec:authorize="hasAuthority('ROLE_ADMIN')">
    <a href="/users">Manage All Users</a>
</div>

</body>
</html>
